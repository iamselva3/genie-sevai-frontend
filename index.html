<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Genie Sevai · Home services, handled</title>
    <meta name="description" content="Genie Sevai: book verified professionals for cleaning, salon, AC repair, plumbing, electrical work and more. Pick a slot, pay after the job." />
    <meta name="theme-color" content="#0B0B0C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Show the splash once per browser session.
      (function () {
        try {
          if (sessionStorage.getItem('sevai:splash')) document.documentElement.classList.add('no-splash');
          else sessionStorage.setItem('sevai:splash', '1');
        } catch (e) {}
      })();
    </script>
    <style>
      html,body{background:#FAFAF7;margin:0}
      .no-splash #splash{display:none}
      #splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;color:#FAFAF7;font-family:'Bricolage',ui-sans-serif,system-ui,sans-serif;cursor:pointer}
      #splash .sp-door{position:absolute;left:0;right:0;height:50.5%;background:#0B0B0C;transition:transform .75s cubic-bezier(.77,0,.18,1) .12s}
      #splash .sp-top{top:0}
      #splash .sp-bottom{bottom:0}
      #splash .sp-stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;transition:opacity .3s ease,transform .45s ease}
      /* Emblem: spins in on a 3D axis, then the smoke draws the roof and sparkles pop */
      #splash .sp-emblem{width:128px;height:128px;animation:sp-flip 1.15s cubic-bezier(.2,.8,.2,1) both}
      #splash .sp-emblem svg{width:100%;height:100%;overflow:visible}
      #splash .sp-lamp{transform-box:fill-box;transform-origin:50% 100%;animation:sp-lamp .7s cubic-bezier(.2,.8,.2,1) .35s both}
      #splash .sp-smoke{stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw .8s cubic-bezier(.65,0,.35,1) .75s forwards}
      #splash .sp-spark{transform-box:fill-box;transform-origin:center;animation:sp-spark .55s cubic-bezier(.2,.8,.2,1) both}
      #splash .sp-spark.a{animation-delay:1.05s}
      #splash .sp-spark.b{animation-delay:1.2s}
      /* Wordmark: letters rise, smile draws, "Sevai" tag lands */
      #splash .sp-word{display:flex;align-items:baseline;gap:10px;font-size:54px;font-weight:800;letter-spacing:-.045em;line-height:1;padding-bottom:12px}
      #splash .sp-g{position:relative;display:flex;overflow:visible}
      #splash .sp-g span{display:block;animation:sp-rise .65s cubic-bezier(.2,.8,.2,1) both}
      #splash .sp-smile{position:absolute;right:-4%;bottom:-16px;width:58%;overflow:visible}
      #splash .sp-smile path{stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw .5s ease-out 1.15s forwards}
      #splash .sp-s{background:#FFD400;color:#0B0B0C;border-radius:9px;padding:0 9px 3px;font-size:.8em;animation:sp-tag .55s cubic-bezier(.2,.8,.2,1) 1s both}
      #splash .sp-tag{margin:0;font:500 15px/1.4 'Geist',ui-sans-serif,system-ui,sans-serif;letter-spacing:.02em;color:#A9A8A2;animation:sp-fade .6s ease 1.25s both}
      #splash .sp-bar{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom));left:50%;width:160px;height:3px;margin-left:-80px;background:#2A2A2C;overflow:hidden}
      #splash .sp-bar i{display:block;height:100%;background:#FFD400;transform-origin:left;animation:sp-load 1.6s cubic-bezier(.65,0,.35,1) both}
      #splash.exit{pointer-events:none}
      #splash.exit .sp-stage{opacity:0;transform:scale(.9)}
      #splash.exit .sp-bar{opacity:0}
      #splash.exit .sp-top{transform:translateY(-101%)}
      #splash.exit .sp-bottom{transform:translateY(101%)}
      @keyframes sp-flip{0%{transform:perspective(700px) rotateY(-540deg) scale(.3);opacity:0}60%{opacity:1}100%{transform:perspective(700px) rotateY(0) scale(1);opacity:1}}
      @keyframes sp-lamp{0%{transform:translateY(10px) scale(.85)}100%{transform:none}}
      @keyframes sp-draw{to{stroke-dashoffset:0}}
      @keyframes sp-spark{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
      @keyframes sp-rise{0%{transform:translateY(60%);opacity:0}100%{transform:none;opacity:1}}
      @keyframes sp-tag{0%{transform:translateY(14px) rotate(-8deg) scale(.7);opacity:0}100%{transform:none;opacity:1}}
      @keyframes sp-fade{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
      @keyframes sp-load{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
      @media (max-width:420px){#splash .sp-word{font-size:44px}#splash .sp-emblem{width:108px;height:108px}}
      @media (prefers-reduced-motion: reduce){
        #splash *{animation:none!important}
        #splash .sp-smoke,#splash .sp-smile path{stroke-dashoffset:0}
        #splash .sp-door{transition:opacity .3s ease}
        #splash.exit .sp-top,#splash.exit .sp-bottom{transform:none;opacity:0}
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-door sp-top"></div>
      <div class="sp-door sp-bottom"></div>
      <div class="sp-stage">
        <div class="sp-emblem">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="31" fill="#0B0B0C" stroke="#FFD400" stroke-width="1.2" />
            <path class="sp-smoke" pathLength="1" d="M52.6 33.4C58 28.4 56.6 23.4 50.6 20.4L40.5 12 30.4 20.4" fill="none" stroke="#FAFAF7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
            <path class="sp-smoke" pathLength="1" d="M47.6 26.6C45 25.4 45.6 22.4 48.2 22.6" fill="none" stroke="#FAFAF7" stroke-width="2" stroke-linecap="round" />
            <path class="sp-spark a" d="M17 11.5 18.4 15.6 22.5 17 18.4 18.4 17 22.5 15.6 18.4 11.5 17 15.6 15.6Z" fill="#FFD400" />
            <path class="sp-spark b" d="M50 43 50.9 45.6 53.5 46.5 50.9 47.4 50 50 49.1 47.4 46.5 46.5 49.1 45.6Z" fill="#FFD400" />
            <g class="sp-lamp">
              <path d="M13.2 38.2C8 36.8 7 44 13.4 43.4" fill="none" stroke="#FFD400" stroke-width="2.6" stroke-linecap="round" />
              <path d="M22.5 47.6h11l2.6 3.9H19.9Z" fill="#E5BE00" stroke="#0B0B0C" stroke-width="1.2" stroke-linejoin="round" />
              <path d="M12.4 39C12.4 45.4 19.3 48 28 48S41 45.6 44.2 42.2L53.4 35.6C54.6 34.7 53.8 33 52.4 33.5L43.6 36.7C40 35.6 35 35.1 28 35.1S12.4 36 12.4 39Z" fill="#FFD400" stroke="#0B0B0C" stroke-width="1.2" stroke-linejoin="round" />
              <path d="M19.2 35.4C19.6 30.6 23.6 28.5 28 28.5S36.4 30.6 36.8 35.4Z" fill="#E5BE00" stroke="#0B0B0C" stroke-width="1.2" stroke-linejoin="round" />
              <circle cx="28" cy="26.4" r="2.2" fill="#FFD400" stroke="#0B0B0C" stroke-width="1.1" />
            </g>
          </svg>
        </div>
        <div class="sp-word">
          <span class="sp-g">
            <span style="animation-delay:.55s">G</span><span style="animation-delay:.61s">e</span><span style="animation-delay:.67s">n</span><span style="animation-delay:.73s">i</span><span style="animation-delay:.79s">e</span>
            <svg class="sp-smile" viewBox="0 0 100 22"><path pathLength="1" d="M6 5Q50 27 94 5" fill="none" stroke="#FFD400" stroke-width="10" stroke-linecap="round" /></svg>
          </span>
          <span class="sp-s">Sevai</span>
        </div>
        <p class="sp-tag">Home services, handled.</p>
      </div>
      <div class="sp-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
